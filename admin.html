<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>

    <h1>
    <a class="LOGO" href="index.html">
        CinemaFun
    </a>
    </h1>
    <button id="menu-btn">
        ☰
    </button>

    <nav id="menu">
        <a href="index.html">Главная</a>
        <a href="movies.html">Афиша</a>
        <a href="tickets.html">Мои билеты</a>
        <a href="contacts.html">Контакты</a>
        <a href="admin.html">Админ</a>
    </nav>

</header>

<main>

    <h2>Админ панель</h2>

    <div class="admin-grid">

        <section class="admin-card">

            <h3>🎬 Добавить фильм</h3>

            <input
                type="text"
                id="movie-name"
                placeholder="Название фильма"
            >

            <button id="add-btn">
                Добавить фильм
            </button>

        </section>

        <section class="admin-card">

            <h3>✏ Изменить фильм</h3>

            <input
                type="number"
                id="put-id"
                placeholder="ID фильма"
            >

            <input
                type="text"
                id="put-name"
                placeholder="Новое название"
            >

            <button id="put-btn">
                Сохранить изменения
            </button>

        </section>

        <section class="admin-card">

            <h3>⭐ Изменить рейтинг</h3>

            <input
                type="number"
                id="patch-id"
                placeholder="ID фильма"
            >

            <input
                type="number"
                id="patch-rating"
                placeholder="Новый рейтинг"
            >

            <button id="patch-btn">
                Обновить рейтинг
            </button>

        </section>

    </div>

</main>

<footer>
    <p>© 2026 CinemaFun</p>
</footer>

<script src="js/admin.js"></script>

</body>
</html>
